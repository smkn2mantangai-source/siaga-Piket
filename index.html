    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        
        /* Smooth Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Animations */
        .fade-in-up { animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeInUp { 
            0% { opacity: 0; transform: translateY(20px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }
        
        /* Modern Loader */
        .loader { 
            border: 4px solid rgba(99, 102, 241, 0.1); 
            border-left-color: #4f46e5; 
            border-radius: 50%; 
            width: 48px; height: 48px; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Form Controls & Interactions */
        .input-modern { transition: all 0.2s ease; border: 1.5px solid #e2e8f0; }
        .input-modern:focus { border-color: #4f46e5; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); outline: none; }
        .btn-modern { transition: all 0.2s ease; }
        .btn-modern:active { transform: scale(0.97); }

        /* Custom Radio/Checkbox Cards */
        .radio-card-input:checked + .radio-card-body {
            background-color: #eef2ff;
            border-color: #4f46e5;
        }
        
        /* Sidebar & Menu */
        .nav-item { transition: all 0.2s ease; border-left: 3px solid transparent; }
        .nav-item.active { background-color: #eef2ff; color: #4f46e5; border-left: 3px solid #4f46e5; font-weight: 700; }
        .nav-item:hover:not(.active) { background-color: #f1f5f9; }
        
        /* Minimized Sidebar (Desktop) */
        .sidebar-minimized { width: 5rem !important; }
        .sidebar-minimized .menu-text, .sidebar-minimized .menu-header, .sidebar-minimized .user-info-text { display: none; }
        .sidebar-minimized .nav-item { justify-content: center; padding-left: 0; padding-right: 0; }
        .sidebar-minimized .nav-item span.mr-3 { margin-right: 0; font-size: 1.5rem; }
        
        /* Table Enhancements */
        .table-container { max-height: 65vh; overflow-y: auto; overflow-x: auto; }
        .sticky-col { position: sticky; left: 0; z-index: 10; background-color: white; }
        .sticky-header { position: sticky; top: 0; z-index: 20; background-color: #f8fafc; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .sticky-col-header { position: sticky; left: 0; top:0; z-index: 30; background-color: #f8fafc; }

        /* Print Styles */
        @media print {
            body { background-color: white; font-size: 12px; }
            #sidebar, #mobileHeader, .top-nav, button, .no-print, .filter-section, #sidebarOverlay { display: none !important; }
            #mainContent { margin-left: 0 !important; padding: 0 !important; width: 100% !important; display: block !important; }
            .app-view { display: none !important; }
            .app-view.print-active { display: block !important; width: 100%; box-shadow: none; border: none; }
            .print-header { display: block !important; text-align: center; margin-bottom: 20px; }
            .table-container { max-height: none; overflow: visible; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
        .print-header { display: none; }
    </style>

        // --- Core API Caller ---
        async function apiCall(action, data = null) {
            try {
                if (API_URL === 'PASTE_LINK_API_ANDA_DISINI_NANTI') {
                    throw new Error("URL API belum diganti. Silakan periksa file Index.html");
                }
                let url = API_URL + '?action=' + action;
                let options = { method: 'GET' };
                if (data) options = { method: 'POST', body: JSON.stringify(data), headers: { 'Content-Type': 'text/plain;charset=utf-8' } };
                const response = await fetch(url, options);
                const result = await response.json();
                return result;
            } catch (error) { 
                hideLoading();
                Swal.fire('Koneksi Gagal', 'Tidak dapat terhubung ke server. Pastikan internet aktif dan URL API_URL di kode Anda sudah benar.<br><br>Detail: ' + error.message, 'error');
                throw new Error("Koneksi ke server gagal."); 
            }
        }

        function navigate(viewId) {
            document.querySelectorAll('.app-view').forEach(el => {
                el.classList.add('hidden'); el.classList.remove('print-active');
            });
            const targetView = document.getElementById('view-' + viewId);
            if(targetView) {
                targetView.classList.remove('hidden'); targetView.classList.add('print-active'); targetView.classList.add('fade-in-up'); 
            }
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-' + viewId).forEach(el => el.classList.add('active'));
            
            if(window.innerWidth < 768 && !document.getElementById('sidebar').classList.contains('-translate-x-full')) {
                toggleSidebar();
            }

            if(viewId === 'dashboard') loadDashboardPiket();
            if(viewId === 'logbook') fetchLogbook();
            
            // Render Super Data
            if(['rekapHadir', 'trenSemester', 'rekapLanggar', 'dashboardSiswa'].includes(viewId)) {
                if(!isDataFetched) {
                    fetchSuperData(viewId);
                } else {
                    triggerViewRender(viewId);

            }

            e.preventDefault();

            if(checkedJam.length === 0) return Swal.fire({title:'Ops!', text:'Pilih minimal 1 jam pelajaran (ceklis kotak)', icon:'warning', confirmButtonColor: '#4f46e5'});
            const jamString = checkedJam.join(', ');

            const stat = document.querySelector('input[name="pantauStatus"]:checked').value;
            let adaT = "-", detailT = "-";
            if(stat !== "Pembelajaran berlangsung dengan guru") {
                const tEl = document.querySelector('input[name="pantauAdaTugas"]:checked');

                if(adaT === "Ada Tugas") {

                    if(sel.length===0) return Swal.fire({title:'Ops!', text:'Pilih minimal 1 bentuk tugas', icon:'warning', confirmButtonColor: '#4f46e5'});
                    detailT = sel.join(', ');
                } else {
                    adaT = "Tidak ada tugas";
                }

            showLoading("Menyimpan Laporan...");
            apiCall('savePemantauan', {

        function submitKejadian(e) {
            e.preventDefault();
            const kategoriPilihan = document.getElementById('kejadianKategori').value;
            let deskripsiFinal = document.getElementById('kejadianDeskripsi').value;

            // Jika Kategori Siswa, gabungkan informasi nama dan kelas ke deskripsi
            if (kategoriPilihan === 'Siswa') {
                const k = document.getElementById('kejadianKelas').value;
                const n = document.getElementById('kejadianNama').value;
                if (!k || !n) return Swal.fire('Perhatian', 'Silakan pilih Kelas dan Nama Siswa terkait terlebih dahulu.', 'warning');
                
                deskripsiFinal = `Siswa: ${n} (${k}) - Deskripsi: ${deskripsiFinal}`;
            }

            const fileInput = document.getElementById('kejadianFile');
            const file = fileInput ? fileInput.files[0] : null;

            if (file && file.size > 10 * 1024 * 1024) { 
                Swal.fire('File Terlalu Besar', 'Maksimal ukuran file foto adalah 10 MB.', 'warning');
                return;
            }

            const payload = {
                tanggal: document.getElementById('kejadianTanggal').value, 
                kategori: kategoriPilihan,
                subKategori: document.getElementById('kejadianSubKategori').value, 
                deskripsi: deskripsiFinal,
                tindakLanjut: document.getElementById('kejadianTindakLanjut').value, 
                penginput: currentUser.nama,
                fileData: null, fileName: null, fileMimeType: null
            };

            showLoading("Mengirim Laporan...");
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    payload.fileData = event.target.result;
                    payload.fileName = file.name;
                    payload.fileMimeType = file.type;
                    sendKejadianApi(payload);
                };
                reader.readAsDataURL(file);
            } else {
                sendKejadianApi(payload);
            }
        }

        function sendKejadianApi(payload) {

                if(r.success) { 
                    showToast('success','Laporan Terkirim');

                    document.getElementById('kejadianSiswaContainer').classList.add('hidden');

                } else {
                    Swal.fire('Error', r.message, 'error');
                }
            });
        }

        function applyHadirFilters() {
            if(!globalData.kehadiran) return;
            const fKelas = document.getElementById('filterHadirKelas').value;
            const fBulan = document.getElementById('filterHadirBulan').value;
            const fMulai = document.getElementById('filterHadirMulai').value;
            const fAkhir = document.getElementById('filterHadirAkhir').value;

            let tempData = globalData.kehadiran;
            if (fKelas) tempData = tempData.filter(d => d.kelas === fKelas);
            if (fBulan) tempData = tempData.filter(d => d.tanggal && d.tanggal.split('-')[1] === fBulan);
            if (fMulai) tempData = tempData.filter(d => d.tanggal && new Date(d.tanggal) >= new Date(fMulai));
            if (fAkhir) tempData = tempData.filter(d => d.tanggal && new Date(d.tanggal) <= new Date(fAkhir));

            const pivot = {};
            tempData.forEach(row => {
                if (!pivot[row.nama]) pivot[row.nama] = { nama: row.nama, kelas: row.kelas, H:0, S:0, I:0, A:0, T:0, total:0 };
                const stat = row.status.toUpperCase();
                if (['H', 'S', 'I', 'A', 'T'].includes(stat)) { pivot[row.nama][stat]++; pivot[row.nama].total++; }
            });

            hadirFilteredData = Object.values(pivot).map(d => { d.persen = d.total > 0 ? ((d.H + d.T) / d.total) * 100 : 0; return d; });
            executeSortHadir();
        }

        function sortHadir(col) { sortAscHadir = (sortColHadir === col) ? !sortAscHadir : true; sortColHadir = col; executeSortHadir(); }

            hadirFilteredData.sort((a, b) => {
                let valA = a[sortColHadir], valB = b[sortColHadir];
                if (typeof valA === 'string') return sortAscHadir ? valA.localeCompare(valB) : valB.localeCompare(valA);
                return sortAscHadir ? valA - valB : valB - valA;
            });
            
            const tbody = document.getElementById('rekapHadirBody');
            tbody.innerHTML = hadirFilteredData.length === 0 ? '<tr><td colspan="8" class="p-8 text-center text-slate-500 font-medium bg-slate-50">Tidak ada data yang ditemukan. Pastikan ada riwayat kehadiran di database untuk filter yang dipilih.</td></tr>'

                        <td class="p-3 text-center text-red-700 font-extrabold border-l border-slate-100 bg-red-50/30">${c.A}</td>

        function renderTrenSemester() {
            if(!document.getElementById('view-trenSemester') || !globalData.kehadiran) return;
            const semester = document.getElementById('filterTrenSemester').value; 
            const fKelas = document.getElementById('filterTrenKelas').value;
            
            currentMonthsInfo = semester === 'GANJIL' 
                ? [ {m:'07', name:'Jul'}, {m:'08', name:'Agu'}, {m:'09', name:'Sep'}, {m:'10', name:'Okt'}, {m:'11', name:'Nov'}, {m:'12', name:'Des'} ]
                : [ {m:'01', name:'Jan'}, {m:'02', name:'Feb'}, {m:'03', name:'Mar'}, {m:'04', name:'Apr'}, {m:'05', name:'Mei'}, {m:'06', name:'Jun'} ];

            let tempData = globalData.kehadiran;
            if (fKelas) tempData = tempData.filter(d => d.kelas === fKelas);

            const pivot = {};
            tempData.forEach(row => {
                if(!row.tanggal) return;
                const month = row.tanggal.split('-')[1]; 
                if(!currentMonthsInfo.find(mo => mo.m === month)) return;
                if (!pivot[row.nama]) {
                    pivot[row.nama] = { nama: row.nama, kelas: row.kelas, months: {} };
                    currentMonthsInfo.forEach(mo => pivot[row.nama].months[mo.m] = { H:0, total:0 });
                }
                const stat = row.status.toUpperCase();
                if (['H', 'S', 'I', 'A', 'T'].includes(stat)) {
                    pivot[row.nama].months[month].total++;
                    if(['H', 'T'].includes(stat)) pivot[row.nama].months[month].H++; 
                }
            });

            trenSemesterData = Object.values(pivot).map(student => {
                let totalPersenAllMonths = 0, activeMonthsCount = 0;
                student.monthsPersen = {};
                currentMonthsInfo.forEach(mo => {
                    const dataMo = student.months[mo.m];
                    if (dataMo.total > 0) {
                        const persen = (dataMo.H / dataMo.total) * 100;
                        student.monthsPersen[mo.m] = persen; totalPersenAllMonths += persen; activeMonthsCount++;
                    } else { student.monthsPersen[mo.m] = -1; }
                });
                student.avg = activeMonthsCount > 0 ? (totalPersenAllMonths / activeMonthsCount) : -1;
                return student;
            });
            executeSortTren(); 
        }

        function sortTren(col) { sortAscTren = (sortColTren === col) ? !sortAscTren : true; sortColTren = col; executeSortTren(); }

        function executeSortTren() {
            const trHeader = document.getElementById('trenHeaderRow');
            let headerHTML = `<th class="p-3 font-bold cursor-pointer hover:bg-indigo-100 transition-colors" onclick="sortTren('nama')">Nama Siswa <span class="sort-icon">${sortColTren === 'nama' ? (sortAscTren ? '▲' : '▼') : ''}</span></th>
                              <th class="p-3 font-bold text-center border-l border-indigo-100 cursor-pointer hover:bg-indigo-100 transition-colors" onclick="sortTren('kelas')">Kelas <span class="sort-icon">${sortColTren === 'kelas' ? (sortAscTren ? '▲' : '▼') : ''}</span></th>`;
            
            currentMonthsInfo.forEach(mo => {
                headerHTML += `<th class="p-3 font-bold text-center border-l border-indigo-100 cursor-pointer hover:bg-indigo-100 transition-colors" onclick="sortTren('${mo.m}')">${mo.name} <span class="sort-icon">${sortColTren === mo.m ? (sortAscTren ? '▲' : '▼') : ''}</span></th>`;
            });
            headerHTML += `<th class="p-3 font-bold text-center bg-indigo-200 border-l border-indigo-300 cursor-pointer hover:bg-indigo-300 transition-colors" onclick="sortTren('avg')">Rata-rata <span class="sort-icon">${sortColTren === 'avg' ? (sortAscTren ? '▲' : '▼') : ''}</span></th>`;
            trHeader.innerHTML = headerHTML;

            trenSemesterData.sort((a, b) => {
                let valA = a[sortColTren], valB = b[sortColTren];
                if (sortColTren !== 'nama' && sortColTren !== 'kelas' && sortColTren !== 'avg') { valA = a.monthsPersen[sortColTren]; valB = b.monthsPersen[sortColTren]; }
                if (typeof valA === 'string') return sortAscTren ? valA.localeCompare(valB) : valB.localeCompare(valA);
                return sortAscTren ? valA - valB : valB - valA;
            });

            const tbody = document.getElementById('trenBody');
            tbody.innerHTML = trenSemesterData.length === 0 ? `<tr><td colspan="${currentMonthsInfo.length + 3}" class="p-8 text-center text-slate-500 font-medium">Belum ada data untuk semester ini.</td></tr>` : trenSemesterData.map(student => {
                let rowHTML = `<tr class="hover:bg-indigo-50/50 border-b border-slate-100 transition-colors"><td class="p-3 font-bold text-slate-700 bg-white sticky-col">${student.nama}</td><td class="p-3 text-center border-l border-slate-100"><span class="bg-slate-100 px-3 py-1 rounded-lg text-xs font-semibold">${student.kelas}</span></td>`;
                currentMonthsInfo.forEach(mo => {
                    const persen = student.monthsPersen[mo.m];
                    rowHTML += persen !== -1 ? `<td class="p-3 text-center font-extrabold border-l border-slate-100 ${persen>=80?'text-green-600':persen>=60?'text-yellow-600':'text-red-600'}">${persen.toFixed(1)}%</td>` : `<td class="p-3 text-center text-slate-300 border-l border-slate-100 font-medium">-</td>`;
                });
                rowHTML += student.avg !== -1 ? `<td class="p-3 text-center font-extrabold bg-indigo-50 border-l border-indigo-100 ${student.avg>=80?'text-indigo-700':student.avg>=60?'text-yellow-700':'text-red-700'}">${student.avg.toFixed(1)}%</td></tr>` : `<td class="p-3 text-center text-slate-400 bg-indigo-50 border-l border-indigo-100">-</td></tr>`;
                return rowHTML;
            }).join('');
        }

        function renderStudentDashboard() {
            if(!globalData.kehadiran) return;
            const today = new Date(), currentMonth = String(today.getMonth() + 1).padStart(2, '0');
            let H_bulan = 0, total_bulan = 0;
            const myData = globalData.kehadiran.filter(d => d.nama === currentUser.nama && d.kelas === currentUser.kelas);
            
            myData.forEach(row => {
                if(row.tanggal && row.tanggal.split('-')[1] === currentMonth) {
                    const stat = row.status.toUpperCase();
                    if(['H', 'S', 'I', 'A', 'T'].includes(stat)) { total_bulan++; if(['H', 'T'].includes(stat)) H_bulan++; }
                }
            });
            document.getElementById('siswaBulanIniPersen').innerText = total_bulan > 0 ? ((H_bulan / total_bulan) * 100).toFixed(1) + '%' : '-';

            const semester = document.getElementById('siswaSemesterSelect').value;
            const monthsInfo = semester === 'GANJIL' ? [ {m:'07', n:'Jul'}, {m:'08', n:'Agu'}, {m:'09', n:'Sep'}, {m:'10', n:'Okt'}, {m:'11', n:'Nov'}, {m:'12', n:'Des'} ] : [ {m:'01', n:'Jan'}, {m:'02', n:'Feb'}, {m:'03', n:'Mar'}, {m:'04', n:'Apr'}, {m:'05', n:'Mei'}, {m:'06', n:'Jun'} ];
            
            let monthsData = {}; monthsInfo.forEach(mo => monthsData[mo.m] = { H:0, total:0 });
            myData.forEach(row => {
                if(!row.tanggal) return;
                const month = row.tanggal.split('-')[1];
                if(monthsData[month]) {
                    const stat = row.status.toUpperCase();
                    if(['H', 'S', 'I', 'A', 'T'].includes(stat)) { monthsData[month].total++; if(['H', 'T'].includes(stat)) monthsData[month].H++; }
                }
            });

            let chartLabels = [], chartData = [];
            monthsInfo.forEach(mo => {
                chartLabels.push(mo.n);
                chartData.push(monthsData[mo.m].total > 0 ? ((monthsData[mo.m].H / monthsData[mo.m].total) * 100).toFixed(1) : 0);
            });

            if(siswaChartInstance) siswaChartInstance.destroy();
            Chart.defaults.font.family = "'Plus Jakarta Sans', sans-serif";
            siswaChartInstance = new Chart(document.getElementById('siswaChart').getContext('2d'), {
                type: 'bar', 
                data: { 
                    labels: chartLabels, 
                    datasets: [{ 
                        label: 'Persentase (%)', 
                        data: chartData, 
                        backgroundColor: 'rgba(79, 70, 229, 0.85)', 
                        borderRadius: 6,
                        borderSkipped: false
                    }] 
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    scales: { 
                        y: { 
                            beginAtZero: true, max: 100, 
                            grid: { color: 'rgba(0,0,0,0.05)' },
                            ticks: { font: { weight: '600' } }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { font: { weight: '600' } }
                        }
                    }, 
                    plugins: { legend: { display: false } } 
                }
            });

            renderStudentDetailTable(myData);
        }

        function renderStudentDetailTable(myData = null) {
            if(!globalData.kehadiran) return;
            if(!myData) myData = globalData.kehadiran.filter(d => d.nama === currentUser.nama && d.kelas === currentUser.kelas);
            const fBulan = document.getElementById('siswaFilterBulan').value;

        function exportTableToExcel(tableId, filename) {
            const table = document.getElementById(tableId).cloneNode(true);
            table.querySelectorAll('.sort-icon').forEach(icon => icon.remove());
            const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"></head><body>${table.outerHTML}</body></html>`;
            const blob = new Blob(['\ufeff', html], { type: 'application/vnd.ms-excel' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${filename}_${new Date().toISOString().slice(0,10)}.xls`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }
